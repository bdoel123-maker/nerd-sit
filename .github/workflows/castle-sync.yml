name: State 2348 Castle Sync

on:
  # Allows you to run it manually from GitHub Actions
  workflow_dispatch:

  # Automatic Castle sync
  schedule:
    # Runs every 3rd calendar day at 00:15 UTC
    - cron: "15 0 */3 * *"


jobs:

  castle-sync:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      # ======================================================
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # RUN CASTLE COLLECTOR
      # ======================================================

      - name: Run State 2348 Castle Collector
        env:
          WOSORACLE_API_TOKEN: ${{ secrets.WOSORACLE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

        run: |
          python castle_collector.py

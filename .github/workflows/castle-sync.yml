name: State 2348 Castle Sync

on:
  # Manual run button
  workflow_dispatch:

  # Automatic schedule
  schedule:
    # Every 12 hours
    - cron: "15 */12 * * *"

jobs:
  castle-sync:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # ======================================================
      # RUN CASTLE COLLECTOR
      # ======================================================

      - name: Run State 2348 Castle Collector
        env:
          WOSORACLE_API_TOKEN: ${{ secrets.WOSORACLE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

        run: |
          python castle_collector.py

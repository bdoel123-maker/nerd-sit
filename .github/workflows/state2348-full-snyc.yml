name: State 2348 Full WOS Sync

on:
  schedule:
    # Run at 13:00 UTC every 2 days
    - cron: "0 13 */2 * *"

  # Allows you to run it manually from GitHub Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run State 2348 collector
        env:
          WOSORACLE_API_TOKEN: ${{ secrets.WOSORACLE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python main.py

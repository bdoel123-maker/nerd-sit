name: WOS State 2348 Supabase Sync

on:
  # Runs once every Sunday at 06:00 UTC.
  schedule:
    - cron: '0 6 * * 0'

  # Allows you to run it manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wos-state2348-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests python-dotenv

      - name: Run WOS Oracle to Supabase sync
        env:
          WOSORACLE_API_TOKEN: ${{ secrets.WOSORACLE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py

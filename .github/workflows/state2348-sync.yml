name: State 2348 WOS Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "0 13 * * 1"

jobs:
  sync:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    permissions:
      contents: read

    env:
      WOSORACLE_API_TOKEN: ${{ secrets.WOSORACLE_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout Nerd Sit
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run WOS sync
        run: python main.py

name: Pull Requested Players

on:
  workflow_dispatch:

jobs:
  pull-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull player data
        env:
          WOSORACLE_API_TOKEN: ${{ secrets.WOSORACLE_API_TOKEN }}
        run: python pull_players.py

      - name: Upload player CSV
        uses: actions/upload-artifact@v4
        with:
          name: requested-player-data
          path: requested_players.csv

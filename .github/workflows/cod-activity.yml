name: COD Activity Tracker

on:
  workflow_dispatch:

  schedule:
    # Run once per day at 05:10 UTC
    # Slightly offset to avoid GitHub's busiest scheduled times
    - cron: "10 5 * * *"

jobs:
  collect-cod-activity:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run COD activity collector
        env:
          WOSORACLE_API_TOKEN: ${{ secrets.WOSORACLE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python cod_activity.py

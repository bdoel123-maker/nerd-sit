name: ONF Activity Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

jobs:
  collect-onf-activity:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "GITHUB_WORKSPACE:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Files in root:"
          ls -la

          echo ""
          echo "ALL Python files:"
          find "$GITHUB_WORKSPACE" -type f -name "*.py" -print

          echo ""
          echo "Anything containing onf:"
          find "$GITHUB_WORKSPACE" -type f -iname "*onf*" -print

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ONF activity collector
        env:
          WOSORACLE_API_TOKEN: ${{ secrets.WOSORACLE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python "$GITHUB_WORKSPACE/onf_collector.py"
